spring:
  datasource:
    url: jdbc:h2:mem:pdv-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

jwt:
  secret: test-secret-value-for-jwt-should-be-at-least-256-bits-long-1234567890
  expiration-ms: 3600000
