version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdv-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdv_db}
      POSTGRES_USER: ${POSTGRES_USER:-pdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdv-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/pdv_db}
      DB_USERNAME: ${DB_USERNAME:-pdv}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret_for_local_dev_please_replace_123456}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
