version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdv-postgres
    environment:
      POSTGRES_DB: pdv_db
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: pdv123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdv-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pdv_db
      DB_USERNAME: pdv
      DB_PASSWORD: pdv123
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
